name: CI

on:
 push:
  branches: [ main ]
 pull_request:
  branches: [ main ]

jobs:
 test:
  runs-on: ubuntu-latest

  steps:
    - name: 取得程式碼
      uses: actions/checkout@v4

    - name: 安裝 Java 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: maven

    - name: 讓 mvnw 可以執行
      run: chmod +x mvnw

    - name: 執行測試
      run: ./mvnw -B test