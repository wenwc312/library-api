<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>圖書館管理</title>
    <link rel="stylesheet" href="/css/common.css">
</head>
<body>
<div class="container">
    <header class="header">
        <h1>圖書館管理</h1>
    </header>

    <a href="/index.html">← 回到借還書頁面</a>

    <section class="card">
        <h2>新增書籍</h2>
        <div class="form">
            <label>書名: <input type="text" id="newBookName"></label>
            <label>作者: <input type="text" id="newBookAuthor"></label>
            <label>ISBN: <input type="text" id="newBookIsbn"></label>
            <button onclick="addBook()">新增書籍</button>
        </div>
        <p id="addBookResult" class="message"></p>
    </section>

    <section class="card">
        <h2>新增會員</h2>
        <div class="form">
            <label>姓名: <input type="text" id="newMemberName"></label>
            <label>會員編號: <input type="text" id="newMemberId"></label>
            <button onclick="addMember()">新增會員</button>
        </div>
        <p id="addMemberResult" class="message"></p>
    </section>

    <footer class="footer">
        <button id="logoutButton" class="secondary">登出</button>
    </footer>
</div>

<script src="/js/common.js"></script>
<script>
    // 新增書籍
    function addBook(){
        const book={
            name: document.getElementById("newBookName").value,
            author: document.getElementById("newBookAuthor").value,
            ISBN: document.getElementById("newBookIsbn").value
        };

        postJson(API_BASE,book)
        .then(response => {
            if(!checkLogin(response)) return;
            return response.text().then(message => {
                showMessage(document.getElementById("addBookResult"),message,response.ok ? "success" : "error");
            });
        })
        .catch(() => {
            showNetworkError(document.getElementById("addBookResult"))
        });
    }

    // 新增會員
    function addMember() {
        const member = {
            name: document.getElementById("newMemberName").value,
            userId: document.getElementById("newMemberId").value
        };

        postJson("/members",member)
        .then(response => {
            if(!checkLogin(response)) return;
            return response.text().then(message => {
                showMessage(document.getElementById("addMemberResult"),message,response.ok ? "success" : "error");
            });
        })
        .catch(() => {
            showNetworkError(document.getElementById("addMemberResult"))
        });
    }

    // 登出
    document.getElementById("logoutButton").addEventListener("click", () =>{
        fetch("/auth/logout", { method: "POST" })
        .then(() => {
            window.location.href = "/login.html";
        })
        .catch(() => alert("登出失敗，請確認網路連線"));
    });

    // 檢查是否登入過期，過期就導回登入頁
    function checkLogin(response){
        if(response.status === 401){
            alert("登入已過期，請重新登入");
            window.location.href = "/login.html";
            return false;
        }
        return true;
    }
</script>
</body>
</html>
