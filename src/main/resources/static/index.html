<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>圖書館系統</title>
    <link rel="stylesheet" href="/css/common.css">
    <style>
        #result { margin-top: 10px; color: #333; }
    </style>
</head>
<body>

<h1>圖書館系統</h1>

<h2>借書</h2>
會員編號: <input type="text" id="borrowUserId">
書籍ISBN: <input type="text" id="borrowIsbn">
<button onclick="borrowBook()">借書</button>

<h2>還書</h2>
會員編號: <input type="text" id="returnUserId">
書籍ISBN: <input type="text" id="returnIsbn">
<button onclick="returnBook()">還書</button>

<div id="result"></div>

<h2>查詢會員借閱清單</h2>
會員編號: <input type="text" id="queryUserId">
<button onclick="loadBorrowedBooks()">查詢</button>
<ul id="borrowedList"></ul>

<h2>搜尋書籍</h2>
關鍵字(書名/作者/ISBN): <input type="text" id="searchKeyword">
<button onclick="searchBook()">搜尋</button>
<ul id="searchResult"></ul>

<h2>可借閱書籍</h2>
<button onclick="loadAvailableBooks()">重新整理清單</button>
<ul id="bookList"></ul>

<a href="/admin.html">前往管理頁面 →</a>

<script src="/js/common.js"></script>
<script>
    // 借書
    function borrowBook(){
        const userId = document.getElementById("borrowUserId").value;
        const isbn = document.getElementById("borrowIsbn").value;

        fetch(`${API_BASE}/borrow?userId=${userId}&isbn=${isbn}`,{
            method: "POST"
        })
        .then(response => response.text())
        .then(message => {
            document.getElementById("result").innerText = message;
            loadAvailableBooks(); // 借完自動刷新清單
        });
    }

    // 還書
    function returnBook(){
        const userId = document.getElementById("returnUserId").value;
        const isbn = document.getElementById("returnIsbn").value;

        fetch(`${API_BASE}/return?userId=${userId}&isbn=${isbn}`,{
            method: "POST"
        })
        .then(response => response.text())
        .then(message => {
            document.getElementById("result").innerText = message;
            loadAvailableBooks();
        });
    }

    // 查看可借閱書籍
    function loadAvailableBooks(){
        fetch(`${API_BASE}/available`)
        .then(response => response.json())
        .then(books => {
            renderBookList(document.getElementById("bookList"),books,"目前沒有可借閱的書籍");
        });
    }

    // 頁面一開啟就先載入一次清單
    loadAvailableBooks();

    // 搜尋書籍
    function searchBook(){
        const keyword = document.getElementById("searchKeyword").value;
        fetch(`${API_BASE}/search?keyword=${keyword}`)
        .then(response => response.json())
        .then(books => {
            renderBookList(document.getElementById("searchResult"),books,"查無符合的書籍",true);
        });
    }

    // 查詢會員借閱清單
    function loadBorrowedBooks(){
        const userId = document.getElementById("queryUserId").value;
        const list = document.getElementById("borrowedList");

        fetch(`${API_BASE}/borrowedByMember?userId=${userId}`)
        .then(response => {
            if(response.status === 404) {
                list.innerHTML = "<li>查無會員資料</li>";
                return null;
            }
            return response.json();
        })
        .then(books => {
            if(books === null) return; // 查無會員，上面已經處理過了

            renderBookList(list,books,"目前沒有借閱中的書籍");
        });
    }
</script>
</body>
</html>
