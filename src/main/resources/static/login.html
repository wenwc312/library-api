<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>管理員登入</title>
    <link rel="stylesheet" href="/css/common.css">
</head>
<body>
<div class="container">
    <a href="/index.html">← 回到借還書頁面</a>

    <section>
        <h1>管理員登入</h1>
        <form id="loginForm" class="form">
            <label>帳號: <input type="text" id="username"></label>
            <label>密碼: <input type="password" id="password"></label>
            <button type="submit">登入</button>
        </form>
        <p id="loginResult" class="message"></p>
    </section>
</div>

<script src="/js/common.js"></script>
<script>
    document.getElementById("loginForm").addEventListener("submit", event => {
        event.preventDefault(); // 阻止表單預設的送出行為(會重新整理頁面)

        const loginData = {
            username: document.getElementById("username").value,
            password: document.getElementById("password").value
        };

        postJson("/auth/login",loginData)
        .then(response => {
            if(response.ok){
                window.location.href = "/admin.html"; //登入成功，跳轉到管理頁面
                return;
            }
            return response.text().then(message => {
                showMessage(document.getElementById("loginResult"),message,"error");
            });

        });
    });

</script>
</body>
</html>
